name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ShinaDualSpace-v2.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1
          name: Shina Dual Space v2.1
          body: |
            Shina Dual Space v2.1 — clone fix for the Work Profile flow.

            What was wrong in v2.0: Setup succeeded, but cloning did nothing. The cross-profile intent filters were only registered if you happened to open the work-profile copy of the app first, and the clone request intent was pinned to the personal profile so Android never forwarded it. If it landed in the wrong profile it was dropped silently.

            Fixes in v2.1:
            - Cross-profile filters are now registered during provisioning (in the admin receiver, which runs inside the new profile) and again on work-side launch.
            - Clone requests are no longer pinned to the personal profile and use a new-task flag.
            - Wrong-profile clone requests now explain what happened instead of failing silently.
            - Work profile detection no longer mistakes another app's work profile for ours.
            - Inside the Work Profile, + Tambah now opens a manual clone dialog (type a package name such as com.whatsapp); the personal side shows each app's package name on long-press. The work-side picker also tries to list parent apps Android exposes cross-profile.

            Install: download ShinaDualSpace-v2.1.apk below and install over v2.0. Your list and PIN stay.

            REQUIRED first step after updating (important, because your work profile was created by v2.0): open Shina Dual Space from the Work Profile once — that's the copy whose icon has the small briefcase badge, in the "Work" app tab — and leave it open a few seconds so it can register the clone filters. Then go back to the personal copy, add/clone your app. Alternatively, stay in the work copy, tap + Tambah, and clone manually by package name.

            Honest note: this fixes the known v2.0 delivery bugs, but the flow still needs your on-device confirmation. If cloning still fails, tell us exactly which toast/message you see.
          files: ShinaDualSpace-v2.1.apk
