name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ShinaDualSpace-v2.2.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2
          name: Shina Dual Space v2.2
          body: |
            Shina Dual Space v2.2 — security hardening for the clone trigger.

            Why: in v2.0/v2.1 the exported MainActivity also carried the CLONE intent-filter with no permission, so any other app on the phone could send a clone intent into the Work Profile and it would run installExistingPackage immediately (with only a toast). That pattern resembles the abused Shelter-fork pattern in recent Vwork/Gigabud reporting. This is hardening based on a code review — it is not a report that the app was exploited.

            Changes in v2.2:
            - Clone requests now go through a dedicated CloneActivity protected by a signature-level permission (com.shina.dualspace.permission.TRIGGER_CLONE). Only apps signed with the same certificate — our personal-profile and work-profile copies — can trigger it. The launcher MainActivity no longer accepts clone intents.
            - Every clone request now requires an explicit confirmation dialog in the work profile ("Ya, clone" / "Batal") before anything is installed.
            - Indonesian banking / e-wallet apps trigger a hard warning before cloning (banking apps may treat a fresh Work Profile session as a high-risk signal). It warns and requires an explicit "Tetap lanjut, saya paham" — it does not silently proceed. Strong recommendation: do not clone banking/e-wallet apps.
            - Same warnings apply to the in-app clone picker and the manual clone-by-package dialog.

            Install: download ShinaDualSpace-v2.2.apk below and install over v2.1. Your list, PIN and existing Work Profile stay. After updating, open the Work Profile copy (briefcase badge) once, as with v2.1, then clone from the personal copy and confirm the new dialog.
          files: ShinaDualSpace-v2.2.apk
