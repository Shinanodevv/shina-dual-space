name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ShinaDualSpace-v2.3.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3
          name: Shina Dual Space v2.3
          body: |
            Shina Dual Space v2.3 — fixes cloned apps doing nothing when tapped.

            Root cause found: v2.2 protected the clone entry point with a signature-level permission. Every GitHub Actions debug build is signed with a fresh runner debug key, so the copy in your personal profile and the copy inside the Work Profile (installed from a different release) have different certificates — Android silently blocked every clone request. Tapping did nothing.

            Changes in v2.3:
            - Removed the signature permission from the clone entry point. Safety now comes from the mandatory confirmation dialog in the work profile: nothing can be cloned without you tapping "Ya, clone". Another app can at most pop that dialog.
            - Launch failures are no longer swallowed silently; you will see the actual launch error in a dialog instead of a dead tap.
            - Finance-app warnings from v2.2 stay.

            REQUIRED clean start (important): because the old Work Profile was created by a differently-signed build, delete it first, then set up fresh with this single v2.3 APK so both copies share one signature.
            1. Settings > search "profil kerja" > Hapus profil kerja (this deletes old clones and their data; your main apps are untouched).
            2. Uninstall Shina Dual Space, then install ShinaDualSpace-v2.3.apk.
            3. Open it > Setup Work Profile > approve. Open the briefcase-badge copy once, then clone from the main copy and confirm the dialog.

            Honest note: this fixes the identified signature-mismatch blocker, but on-device confirmation is still needed. If a tap still fails, the new dialog shows the error text — send us exactly that text.
          files: ShinaDualSpace-v2.3.apk
