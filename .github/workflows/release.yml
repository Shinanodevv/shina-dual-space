name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ShinaDualSpace-v2.4.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4
          name: Shina Dual Space v2.4
          body: |
            Shina Dual Space v2.4 — clone actually reaches the Work Profile now.

            What was wrong (confirmed on a Xiaomi device): tapping Clone opened Android's "Complete Action Using" chooser and its Work tab was always empty, so requests looped back to the personal profile. Implicit cross-profile intent forwarding is unreliable on OEM resolvers.

            Changes in v2.4:
            - Clone requests now use CrossProfileApps.startActivity, the official API for an app to start its own counterpart in the other profile. It goes straight to the work-profile copy's confirmation dialog, no chooser in between. The old implicit-intent path remains as a fallback.
            - Stable signing: builds are now signed with a committed throwaway debug-grade keystore instead of a fresh runner key every build. From v2.4 onward, future updates install over each other and both profile copies share one signature. (This is why one last clean start is needed: v2.4's signature differs from v2.3's.)
            - Finance-app warnings and the mandatory confirmation dialog stay.

            One last clean start:
            1. Settings > search "profil kerja" > Hapus profil kerja (old clones and their data are deleted; main apps untouched).
            2. Uninstall Shina Dual Space, install ShinaDualSpace-v2.4.apk.
            3. Open it > Setup Work Profile > approve. Then clone from the main copy: it should jump straight to the work-profile "Ya, clone" confirmation, with no Personal/Work chooser.

            If it still fails, tell us exactly what appears instead of the confirmation dialog.
          files: ShinaDualSpace-v2.4.apk
