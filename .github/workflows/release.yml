name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ShinaDualSpace-v2.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0
          name: Shina Dual Space v2.0
          body: |
            Shina Dual Space v2.0 — now with real cloning via Android Work Profile.

            What changed from v1.0: v1 was only a launcher (tapping opened the original app). v2.0 creates a managed Work Profile (same technology as Shelter / Island / Samsung Secure Folder) and clones apps into it, so each clone has its own data and login, separate from the main app.

            Install: download ShinaDualSpace-v2.0.apk below, open it on your Android phone, allow installation if asked (it updates over v1.0, your Dual Space list and PIN stay). 

            How to use the real clone:
            1. Open the app and tap "Setup Work Profile", then approve Android's work profile creation screens. This is a one-time setup. If your phone already has a work profile from work/Shelter/Island, setup may fail — tell us in that case.
            2. After setup, open Shina Dual Space once from the work profile side if Android asks (icon with a small briefcase badge), so it can finish enabling the profile.
            3. Back in the main app, tap + Tambah and pick an app — it will be cloned into the Work Profile. Tap a cloned app (marked with a check) to launch the clone with separate data. Long-press an app for clone/open/move options.
            4. Secret Zone and the optional 4-6 digit PIN lock from v1.0 are still there.

            Notes: one clone per app (one work profile), cloned apps show Android's briefcase badge outside this app, and removing a clone completely is done from Android Settings for the work profile. This is an install-over update of the v1.0 launcher with the same package name.
          files: ShinaDualSpace-v2.0.apk
